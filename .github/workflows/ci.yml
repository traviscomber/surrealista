name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prospección regression tests
        run: |
          TEST_OUT=".tmp-prospeccion-tests-${GITHUB_SHA}"
          rm -rf "$TEST_OUT"
          pnpm exec tsc -p tsconfig.prospeccion-tests.json --outDir "$TEST_OUT"
          node --test "$TEST_OUT/tests/prospeccion-normalization.test.js"
          node --test "$TEST_OUT/tests/prospeccion-public-agri-region.test.js"
          node --test "$TEST_OUT/tests/prospeccion-owner-web.test.js"
          node --test "$TEST_OUT/tests/prospeccion-lead-state.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-temporal.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-memory.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-attention.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-spatial.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-targeting.test.js"
          rm -rf "$TEST_OUT"

      - name: Production build
        run: pnpm build

      - name: Install smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated route smoke
        env:
          INTERNAL_ACCESS_SECRET: ci-smoke-signing-secret
          SMOKE_SIGNING_SECRET: ci-smoke-signing-secret
        run: |
          pnpm start -H 127.0.0.1 > /tmp/sur-realista.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm test:smoke

      - name: Production cloud browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://sur-realista.vercel.app
          SMOKE_PASSWORD: ${{ secrets.SURREALISTA_E2E_PASSWORD }}
        run: pnpm test:smoke

      - name: Upload cloud browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-evidence
          path: test-results/cloud-browser/
          if-no-files-found: warn
          retention-days: 14
