name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Prospección regression tests
        run: |
          TEST_OUT=".tmp-prospeccion-tests-${GITHUB_SHA}"
          rm -rf "$TEST_OUT"
          pnpm exec tsc -p tsconfig.prospeccion-tests.json --outDir "$TEST_OUT"
          node --test "$TEST_OUT/tests/prospeccion-normalization.test.js"
          node --test "$TEST_OUT/tests/prospeccion-public-agri-region.test.js"
          node --test "$TEST_OUT/tests/prospeccion-owner-web.test.js"
          node --test "$TEST_OUT/tests/prospeccion-lead-state.test.js"
          node --test "$TEST_OUT/tests/prospeccion-cross-layer-signal.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-temporal.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-memory.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-attention.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-spatial.test.js"
          node --test "$TEST_OUT/tests/prospeccion-sentinel-targeting.test.js"
          rm -rf "$TEST_OUT"

      - name: Production build
        run: pnpm build

      - name: Install smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated route smoke
        env:
          INTERNAL_ACCESS_SECRET: ci-smoke-signing-secret
          SMOKE_SIGNING_SECRET: ci-smoke-signing-secret
        run: |
          pnpm start -H 127.0.0.1 > /tmp/sur-realista.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm test:smoke

      - name: Wait for exact production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_URL: https://sur-realista.vercel.app/api/release
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..60}; do
            DEPLOYED_SHA="$(curl --fail --silent --max-time 10 "$RELEASE_URL" | node -e 'let data=""; process.stdin.on("data",c=>data+=c); process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(data).commitSha||"")}catch{}})' || true)"
            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Exact production deployment is ready: $DEPLOYED_SHA"
              exit 0
            fi
            echo "Waiting for production SHA $EXPECTED_SHA (current: ${DEPLOYED_SHA:-unavailable})"
            sleep 10
          done
          echo "Production alias did not reach expected SHA $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Production cloud browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://sur-realista.vercel.app
          SMOKE_PASSWORD: ${{ secrets.SURREALISTA_E2E_PASSWORD }}
        run: pnpm test:smoke

      - name: Upload cloud browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-browser-evidence
          path: test-results/cloud-browser/
          if-no-files-found: warn
          retention-days: 14
